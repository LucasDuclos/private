<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariage Clémence & Lucas - Invitation</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        body { background-color: #141414; color: #111111; margin: 0; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }

        .scene-container {
            perspective: 1600px;
            width: 100%;
            max-width: 620px;
            height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .envelope-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }
        .envelope-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            background: #d8c5a2;
            border: 1px solid #b59f78;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        /* Texture parchemin ancien */
        .parchment-texture {
            background-image: radial-gradient(rgba(0,0,0,0.05) 1px, transparent 0);
            background-size: 16px 16px;
        }

        /* --- DOS DE LA LETTRE --- */
        .envelope-back {
            transform: rotateY(0deg);
            background: linear-gradient(135deg, #e4d3b5 0%, #c4ad85 100%);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Timbre et Tampon Postal (cachet de la poste) */
        .postal-mark-container {
            position: absolute;
            top: 25px;
            left: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events-none;
        }
        .stamp {
            width: 52px; height: 65px;
            background: #faf6ef; border: 2px dashed #b5a995;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1); transform: rotate(-4deg);
        }
        .postmark {
            width: 80px; height: 80px;
            border: 2px solid rgba(80, 60, 40, 0.4);
            border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: monospace; font-size: 9px; color: rgba(80, 60, 40, 0.6);
            transform: rotate(12deg);
            text-align: center;
            line-height: 1.1;
        }
        .postmark-line {
            width: 100%; height: 1px; background: rgba(80, 60, 40, 0.4); margin: 3px 0;
        }

        /* --- FACE AVANT DE LA LETTRE --- */
        .envelope-front {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #e4d3b5 0%, #c4ad85 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .fold-top {
            position: absolute; top: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(180deg, rgba(0,0,0,0.12) 0%, transparent 100%), #d1bc95;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.15);
            z-index: 3;
        }
        .fold-bottom {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(0deg, rgba(0,0,0,0.12) 0%, transparent 100%), #e2cfad;
            clip-path: polygon(0 100%, 100% 100%, 50% 0%);
            box-shadow: inset 0 -6px 12px rgba(0,0,0,0.15);
            z-index: 1;
        }
        .fold-left {
            position: absolute; top: 0; left: 0; width: 50%; height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.12) 0%, transparent 100%), #cca882;
            clip-path: polygon(0 0, 0 100%, 100% 50%);
            box-shadow: inset 6px 0 12px rgba(0,0,0,0.15);
            z-index: 2;
        }
        .fold-right {
            position: absolute; top: 0; right: 0; width: 50%; height: 100%;
            background: linear-gradient(270deg, rgba(0,0,0,0.12) 0%, transparent 100%), #cca882;
            clip-path: polygon(100% 0, 100% 100%, 0 50%);
            box-shadow: inset -6px 0 12px rgba(0,0,0,0.15);
            z-index: 2;
        }

        /* Cachet de cire rouge en relief */
        .wax-seal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80px; height: 80px;
            background: radial-gradient(circle at 35% 35%, #b30000 0%, #700000 65%, #3d0000 100%);
            border-radius: 50%;
            box-shadow: inset 0 4px 10px rgba(255,255,255,0.4), 0 10px 25px rgba(0,0,0,0.5);
            border: 3px solid #2e0000; cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            display: flex; align-items: center; justify-content: center;
            color: #dfbe5a; font-family: 'Playfair Display', serif; font-weight: bold; font-size: 1.4rem;
            z-index: 10;
        }
        .wax-seal:hover { transform: translate(-50%, -50%) scale(1.06); filter: brightness(1.15); }

        .hidden-element { display: none !important; }
    </style>
</head>
<body>

    <div class="scene-container">
        
        <div id="envelope-3d-wrapper" class="envelope-3d parchment-texture">
            
            <!-- 1. DOS DE LA LETTRE -->
            <div class="envelope-face envelope-back parchment-texture">
                
                <!-- Timbre et Tampon de la poste en haut à gauche -->
                <div class="postal-mark-container">
                    <div class="stamp">
                        <span class="text-[10px] font-bold text-red-800">2.70€</span>
                        <span class="text-[7px] text-gray-700 uppercase font-bold">FRANCE</span>
                    </div>
                    <div class="postmark">
                        <span>VERSAILLES</span>
                        <div class="postmark-line"></div>
                        <span>10 . 04 . 2027</span>
                    </div>
                </div>

                <!-- Zone d'écriture à droite -->
                <div class="w-full flex justify-end my-auto pr-4">
                    <div class="w-full max-w-[270px] bg-[#fbf8f1]/95 p-5 rounded border border-[#b59f78] shadow-lg text-left">
                        <label class="block font-handwriting text-2xl text-gray-900 mb-2 font-bold tracking-wide">
                            Destinataire :
                        </label>
                        
                        <div class="space-y-2 mb-2">
                            <input type="text" id="login-first" placeholder="Prénom" class="w-full bg-white border border-[#c4ad85] px-3 py-1.5 text-sm focus:outline-none focus:border-black rounded font-sans shadow-inner">
                            <input type="text" id="login-last" placeholder="Nom" class="w-full bg-white border border-[#c4ad85] px-3 py-1.5 text-sm focus:outline-none focus:border-black rounded font-sans shadow-inner" onkeydown="checkEnterKey(event)">
                        </div>

                        <div id="login-error" class="text-red-700 text-xs font-bold mb-1 hidden-element"></div>
                    </div>
                </div>

                <div class="text-right text-[10px] text-gray-600 uppercase tracking-widest pr-2 pb-1 font-serif">
                    Parchemin Officiel
                </div>
            </div>

            <!-- 2. FACE AVANT DE LA LETTRE -->
            <div class="envelope-face envelope-front parchment-texture">
                <div class="fold-top"></div>
                <div class="fold-left"></div>
                <div class="fold-right"></div>
                <div class="fold-bottom"></div>

                <button type="button" onclick="breakSealAndOpen()" class="wax-seal" title="Ouvrir la lettre">
                    C&L
                </button>
            </div>

        </div>

        <!-- BOUTON DE VALIDATION À L'EXTÉRIEUR -->
        <div id="external-action-area" class="mt-6 text-center">
            <button type="button" onclick="submitIdentity()" class="bg-[#d4af37] text-black border border-[#b8972a] px-8 py-3 uppercase tracking-widest text-xs font-bold hover:bg-[#e6c148] transition-colors rounded-full shadow-[0_5px_15px_rgba(212,175,55,0.4)] cursor-pointer">
                Valider l'enveloppe
            </button>
        </div>

    </div>

    <script>
        const guestDatabase = {
            "jean dupont": { allowBrunch: true, allowHebergement: true },
            "marie martin": { allowBrunch: false, allowHebergement: false },
            "john cena": { allowBrunch: false, allowHebergement: false, isEasterEgg: true }
        };

        function normalizeString(str) {
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        function checkEnterKey(event) {
            if (event.key === 'Enter') {
                submitIdentity();
            }
        }

        function submitIdentity() {
            const first = document.getElementById('login-first').value;
            const last = document.getElementById('login-last').value;
            const errorDiv = document.getElementById('login-error');
            
            if(!first || !last) {
                errorDiv.innerText = "Veuillez remplir votre prénom et nom.";
                errorDiv.classList.remove('hidden-element');
                return;
            }

            const fullName = normalizeString(first) + " " + normalizeString(last);
            
            if(guestDatabase[fullName]) {
                errorDiv.classList.add('hidden-element');
                document.getElementById('external-action-area').style.display = 'none';

                // Rotation 3D pour révéler la face avant avec le sceau
                gsap.to("#envelope-3d-wrapper", {
                    rotateY: 180,
                    duration: 1.2,
                    ease: "power2.inOut"
                });

            } else {
                errorDiv.innerText = "Invitation introuvable.";
                errorDiv.classList.remove('hidden-element');
            }
        }

        function breakSealAndOpen() {
            // Animation d'ouverture / zoom final
            gsap.to("#envelope-3d-wrapper", {
                scale: 6,
                opacity: 0,
                duration: 0.9,
                ease: "power2.in",
                onComplete: () => {
                    alert("Sceau brisé ! Transition vers le site principale active.");
                }
            });
        }
    </script>
</body>
</html>
